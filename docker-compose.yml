version: "3.9"

services:
  api:
    build: .
    container_name: remindz_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  worker:
    build: .
    container_name: remindz_worker
    command: python -m app.workers.reminder_worker
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15
    container_name: remindz_postgres
    restart: always
    environment:
      POSTGRES_USER: remindz
      POSTGRES_PASSWORD: remindz
      POSTGRES_DB: remindz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: remindz_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
